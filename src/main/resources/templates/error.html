<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error</title>
  <style>
    :root {
      --bg: #11111b;
      --surface: #1e1e2e;
      --text: #cdd6f4;
      --muted: #a6adc8;
      --accent: #89b4fa;
      --danger: #f38ba8;
      --border: #313244;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 20% 10%, #1f2233 0%, var(--bg) 45%, #0b0b14 100%);
      color: var(--text);
      font-family: "Roboto", "Noto Sans KR", sans-serif;
      padding: 20px;
    }

    .error-card {
      width: min(680px, 100%);
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: clamp(20px, 4vw, 32px);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
    }

    .status {
      color: var(--danger);
      font-size: clamp(40px, 8vw, 72px);
      font-weight: 700;
      line-height: 1;
      margin: 0;
    }

    h1 {
      margin: 10px 0 8px;
      font-size: clamp(20px, 3vw, 28px);
      font-weight: 600;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .actions {
      margin-top: 22px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      background: transparent;
      transition: all .2s ease;
    }

    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-1px);
    }

    .btn--primary {
      background: color-mix(in srgb, var(--accent) 20%, transparent);
      border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
    }
  </style>
</head>
<body>
  <main class="error-card" th:with="statusCode=${status != null ? status : 500}">
    <p class="status" th:text="${statusCode}">500</p>

    <h1 th:switch="${statusCode}">
      <span th:case="403">접근 권한이 없습니다.</span>
      <span th:case="404">요청한 페이지를 찾을 수 없습니다.</span>
      <span th:case="500">서버 내부 오류가 발생했습니다.</span>
      <span th:case="*">요청을 처리할 수 없습니다.</span>
    </h1>

    <p th:if="${message != null and !#strings.isEmpty(message)}" th:text="${message}">
      요청 처리 중 오류가 발생했습니다.
    </p>
    <p th:unless="${message != null and !#strings.isEmpty(message)}">
      잠시 후 다시 시도해 주세요.
    </p>

    <nav class="actions">
      <a class="btn btn--primary" href="/portal">포털로 이동</a>
    </nav>
  </main>
</body>
</html>
