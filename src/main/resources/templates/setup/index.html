<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/login/css/styles.css}" href="/login/css/styles.css">

  <title>Setup</title>
</head>
<body>
  <div class="login">
    <div class="login__ambient" aria-hidden="true"></div>

    <form class="login__form" th:action="@{/setup}" method="post">
      <h1 class="login__title">초기 관리자 설정</h1>

      <p class="login__message" th:if="${errorMessage}" th:text="${errorMessage}"></p>

      <div class="login__content">
        <div class="login__box">
          <i class="ri-user-3-line login__icon"></i>

          <div class="login__box-input">
            <input type="text" required class="login__input" id="setup-username" name="username" placeholder=" ">
            <label for="setup-username" class="login__label">Username</label>
          </div>
        </div>

        <div class="login__box">
          <i class="ri-lock-2-line login__icon"></i>

          <div class="login__box-input">
            <input type="password" required class="login__input" id="setup-pass" name="password" placeholder=" ">
            <label for="setup-pass" class="login__label">Password</label>
          </div>
        </div>

        <div class="login__box">
          <i class="ri-lock-password-line login__icon"></i>

          <div class="login__box-input">
            <input type="password" required class="login__input" id="setup-confirm" name="confirmPassword" placeholder=" ">
            <label for="setup-confirm" class="login__label">Confirm Password</label>
          </div>
        </div>
      </div>

      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

      <button type="submit" class="login__button">Create Admin</button>
    </form>
  </div>
</body>
</html>
