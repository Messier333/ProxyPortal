spring:
  application:
    name: proxyportal
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: jdbc:h2:mem:portal;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  upload:
    root: uploads

npm:
  base-url: ${NPM_BASE_URL:http://localhost:81}
  identity: ${NPM_IDENTITY:admin}
  secret: ${NPM_SECRET:changeme}

logging:
  level:
    "[org.springframework.jdbc.datasource]": DEBUG
    "[com.zaxxer.hikari]": DEBUG
